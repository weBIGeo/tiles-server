<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="440" fill="#fbfbfb"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">One block, and the levels built from it</text>
  <text x="20" y="48" font-size="12" fill="#555">Generation is block-local down to z13; below that, parents span four blocks.</text>

  <!-- LEFT: block with apron and tile grid -->
  <text x="60" y="76" font-size="13" font-weight="bold" fill="#245">A z13 block (BLOCK_ZOOM)</text>

  <!-- apron outline -->
  <rect x="50" y="90" width="300" height="300" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="52" y="88" font-size="11" fill="#c0392b">+1 px apron on every side (APRON_PX = 4098)</text>

  <!-- block body -->
  <rect x="58" y="98" width="284" height="284" fill="#eef3fb" stroke="#245" stroke-width="2"/>
  <text x="64" y="116" font-size="11" fill="#245">BLOCK_PX = 4096 px square</text>

  <!-- 16x16 grid lines inside block -->
  <g stroke="#9db4d4" stroke-width="1">
    <line x1="75.75" y1="98" x2="75.75" y2="382"/><line x1="93.5" y1="98" x2="93.5" y2="382"/><line x1="111.25" y1="98" x2="111.25" y2="382"/>
    <line x1="129" y1="98" x2="129" y2="382"/><line x1="146.75" y1="98" x2="146.75" y2="382"/><line x1="164.5" y1="98" x2="164.5" y2="382"/>
    <line x1="182.25" y1="98" x2="182.25" y2="382"/><line x1="200" y1="98" x2="200" y2="382"/><line x1="217.75" y1="98" x2="217.75" y2="382"/>
    <line x1="235.5" y1="98" x2="235.5" y2="382"/><line x1="253.25" y1="98" x2="253.25" y2="382"/><line x1="271" y1="98" x2="271" y2="382"/>
    <line x1="288.75" y1="98" x2="288.75" y2="382"/><line x1="306.5" y1="98" x2="306.5" y2="382"/><line x1="324.25" y1="98" x2="324.25" y2="382"/>
    <line x1="58" y1="115.75" x2="342" y2="115.75"/><line x1="58" y1="133.5" x2="342" y2="133.5"/><line x1="58" y1="151.25" x2="342" y2="151.25"/>
    <line x1="58" y1="169" x2="342" y2="169"/><line x1="58" y1="186.75" x2="342" y2="186.75"/><line x1="58" y1="204.5" x2="342" y2="204.5"/>
    <line x1="58" y1="222.25" x2="342" y2="222.25"/><line x1="58" y1="240" x2="342" y2="240"/><line x1="58" y1="257.75" x2="342" y2="257.75"/>
    <line x1="58" y1="275.5" x2="342" y2="275.5"/><line x1="58" y1="293.25" x2="342" y2="293.25"/><line x1="58" y1="311" x2="342" y2="311"/>
    <line x1="58" y1="328.75" x2="342" y2="328.75"/><line x1="58" y1="346.5" x2="342" y2="346.5"/><line x1="58" y1="364.25" x2="342" y2="364.25"/>
  </g>
  <text x="64" y="398" font-size="11" fill="#245">16 x 16 z17 tiles, 256 px each</text>

  <!-- RIGHT: level bars -->
  <text x="420" y="76" font-size="13" font-weight="bold" fill="#245">Tiles this block contributes</text>

  <!-- z17..z13 bars, length proportional to sqrt(tiles) -->
  <rect x="470" y="88" width="260" height="30" rx="4" fill="#2e7d32"/>
  <text x="424" y="108" font-size="12" fill="#222">z17</text>
  <text x="478" y="108" font-size="12" fill="#fff">256 tiles (16 x 16)</text>

  <rect x="470" y="126" width="130" height="30" rx="4" fill="#43a047"/>
  <text x="424" y="146" font-size="12" fill="#222">z16</text>
  <text x="478" y="146" font-size="12" fill="#fff">64</text>

  <rect x="470" y="164" width="65" height="30" rx="4" fill="#66bb6a"/>
  <text x="424" y="184" font-size="12" fill="#222">z15</text>
  <text x="478" y="184" font-size="12" fill="#fff">16</text>

  <rect x="470" y="202" width="33" height="30" rx="4" fill="#81c784"/>
  <text x="424" y="222" font-size="12" fill="#222">z14</text>
  <text x="478" y="222" font-size="12" fill="#fff">4</text>

  <rect x="470" y="240" width="17" height="30" rx="4" fill="#a5d6a7"/>
  <text x="424" y="260" font-size="12" fill="#222">z13</text>
  <text x="493" y="260" font-size="12" fill="#222">1 (the block itself)</text>

  <!-- divider -->
  <line x1="420" y1="288" x2="740" y2="288" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="284" font-size="11" fill="#c0392b">BLOCK_ZOOM = 13 boundary</text>

  <rect x="470" y="300" width="17" height="30" rx="4" fill="#90a4ae"/>
  <text x="424" y="320" font-size="12" fill="#222">z12</text>
  <text x="493" y="320" font-size="12" fill="#333">.. down to z0</text>

  <text x="424" y="352" font-size="11" fill="#333">Below z13 a parent tile (256 px) spans four child</text>
  <text x="424" y="368" font-size="11" fill="#333">blocks, so the level is assembled from all cached</text>
  <text x="424" y="384" font-size="11" fill="#333">blocks at once — _generate_upper_levels, still the</text>
  <text x="424" y="400" font-size="11" fill="#333">same exact float _reduce_2x.</text>

  <text x="58" y="420" font-size="11" fill="#555">Per block: TILES_PER_BLOCK_TOTAL = 1+4+16+64+256 = 341 tiles across z17..z13.</text>
</svg>
