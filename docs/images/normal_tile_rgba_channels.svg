<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="760" height="440" fill="#fbfbfb"/>

  <text x="20" y="30" font-size="18" font-weight="bold" fill="#111">One normal-tile pixel = four bytes (rgba8unorm)</text>
  <text x="20" y="48" font-size="12" fill="#555">The four channels are interleaved per pixel in one RGBA PNG, not stored as separate planes.</text>

  <!-- R -->
  <g>
    <rect x="20" y="62" width="175" height="150" rx="8" fill="#d9534f"/>
    <text x="34" y="94" font-size="22" font-weight="bold" fill="#ffffff">R</text>
    <text x="34" y="120" font-size="12" fill="#ffffff">hemi-oct e.x</text>
    <text x="34" y="140" font-size="12" fill="#ffe6e5">round(e.x * 127) + 127</text>
    <text x="34" y="160" font-size="12" fill="#ffe6e5">codes 0..254, centre 127</text>
    <text x="34" y="186" font-size="12" fill="#ffd0ce">normal x</text>
  </g>

  <!-- G -->
  <g>
    <rect x="205" y="62" width="175" height="150" rx="8" fill="#5cb85c"/>
    <text x="219" y="94" font-size="22" font-weight="bold" fill="#ffffff">G</text>
    <text x="219" y="120" font-size="12" fill="#ffffff">hemi-oct e.y</text>
    <text x="219" y="140" font-size="12" fill="#e6ffe6">round(e.y * 127) + 127</text>
    <text x="219" y="160" font-size="12" fill="#e6ffe6">codes 0..254, centre 127</text>
    <text x="219" y="186" font-size="12" fill="#d0ffd0">normal y</text>
  </g>

  <!-- B -->
  <g>
    <rect x="390" y="62" width="175" height="150" rx="8" fill="#428bca"/>
    <text x="404" y="94" font-size="22" font-weight="bold" fill="#ffffff">B</text>
    <text x="404" y="120" font-size="12" fill="#ffffff">Toksvig roughness L</text>
    <text x="404" y="140" font-size="12" fill="#e6f2ff">round(L * 255)</text>
    <text x="404" y="160" font-size="12" fill="#e6f2ff">1 = coherent, 0 = divergent</text>
    <text x="404" y="186" font-size="12" fill="#cfe6ff">mean-vector magnitude</text>
  </g>

  <!-- A -->
  <g>
    <rect x="575" y="62" width="175" height="150" rx="8" fill="#7d7d7d"/>
    <text x="589" y="94" font-size="22" font-weight="bold" fill="#ffffff">A</text>
    <text x="589" y="120" font-size="12" fill="#ffffff">snow visibility</text>
    <text x="589" y="140" font-size="12" fill="#eeeeee">round(v * 255)</text>
    <text x="589" y="160" font-size="12" fill="#eeeeee">1 = snow can sit</text>
    <text x="589" y="186" font-size="12" fill="#dddddd">0 = too steep (45 deg +)</text>
  </g>

  <text x="20" y="250" font-size="12" fill="#555">A tile, 256 x 256 px - every cell holds all four bytes above:</text>
  <g stroke="#ffffff" stroke-width="1">
    <rect x="20" y="258" width="20" height="20" fill="#8f8fd0"/><rect x="40" y="258" width="20" height="20" fill="#9a90cf"/><rect x="60" y="258" width="20" height="20" fill="#a793cd"/><rect x="80" y="258" width="20" height="20" fill="#b596cb"/><rect x="100" y="258" width="20" height="20" fill="#c29ac8"/><rect x="120" y="258" width="20" height="20" fill="#cf9dc5"/><rect x="140" y="258" width="20" height="20" fill="#dba0c1"/><rect x="160" y="258" width="20" height="20" fill="#e7a3bd"/>
    <rect x="20" y="278" width="20" height="20" fill="#9a90cf"/><rect x="40" y="278" width="20" height="20" fill="#a793cd"/><rect x="60" y="278" width="20" height="20" fill="#b596cb"/><rect x="80" y="278" width="20" height="20" fill="#c29ac8"/><rect x="100" y="278" width="20" height="20" fill="#cf9dc5"/><rect x="120" y="278" width="20" height="20" fill="#dba0c1"/><rect x="140" y="278" width="20" height="20" fill="#e7a3bd"/><rect x="160" y="278" width="20" height="20" fill="#f3a6b9"/>
    <rect x="20" y="298" width="20" height="20" fill="#a793cd"/><rect x="40" y="298" width="20" height="20" fill="#b596cb"/><rect x="60" y="298" width="20" height="20" fill="#c29ac8"/><rect x="80" y="298" width="20" height="20" fill="#cf9dc5"/><rect x="100" y="298" width="20" height="20" fill="#dba0c1"/><rect x="120" y="298" width="20" height="20" fill="#e7a3bd"/><rect x="140" y="298" width="20" height="20" fill="#f3a6b9"/><rect x="160" y="298" width="20" height="20" fill="#6f6f6f"/>
    <rect x="20" y="318" width="20" height="20" fill="#b596cb"/><rect x="40" y="318" width="20" height="20" fill="#c29ac8"/><rect x="60" y="318" width="20" height="20" fill="#cf9dc5"/><rect x="80" y="318" width="20" height="20" fill="#dba0c1"/><rect x="100" y="318" width="20" height="20" fill="#e7a3bd"/><rect x="120" y="318" width="20" height="20" fill="#f3a6b9"/><rect x="140" y="318" width="20" height="20" fill="#6f6f6f"/><rect x="160" y="318" width="20" height="20" fill="#6f6f6f"/>
    <rect x="20" y="338" width="20" height="20" fill="#c29ac8"/><rect x="40" y="338" width="20" height="20" fill="#cf9dc5"/><rect x="60" y="338" width="20" height="20" fill="#dba0c1"/><rect x="80" y="338" width="20" height="20" fill="#e7a3bd"/><rect x="100" y="338" width="20" height="20" fill="#f3a6b9"/><rect x="120" y="338" width="20" height="20" fill="#6f6f6f"/><rect x="140" y="338" width="20" height="20" fill="#6f6f6f"/><rect x="160" y="338" width="20" height="20" fill="#6f6f6f"/>
    <rect x="20" y="358" width="20" height="20" fill="#cf9dc5"/><rect x="40" y="358" width="20" height="20" fill="#dba0c1"/><rect x="60" y="358" width="20" height="20" fill="#e7a3bd"/><rect x="80" y="358" width="20" height="20" fill="#f3a6b9"/><rect x="100" y="358" width="20" height="20" fill="#6f6f6f"/><rect x="120" y="358" width="20" height="20" fill="#6f6f6f"/><rect x="140" y="358" width="20" height="20" fill="#6f6f6f"/><rect x="160" y="358" width="20" height="20" fill="#6f6f6f"/>
    <rect x="20" y="378" width="20" height="20" fill="#dba0c1"/><rect x="40" y="378" width="20" height="20" fill="#e7a3bd"/><rect x="60" y="378" width="20" height="20" fill="#f3a6b9"/><rect x="80" y="378" width="20" height="20" fill="#6f6f6f"/><rect x="100" y="378" width="20" height="20" fill="#6f6f6f"/><rect x="120" y="378" width="20" height="20" fill="#6f6f6f"/><rect x="140" y="378" width="20" height="20" fill="#6f6f6f"/><rect x="160" y="378" width="20" height="20" fill="#6f6f6f"/>
    <rect x="20" y="398" width="20" height="20" fill="#e7a3bd"/><rect x="40" y="398" width="20" height="20" fill="#f3a6b9"/><rect x="60" y="398" width="20" height="20" fill="#6f6f6f"/><rect x="80" y="398" width="20" height="20" fill="#6f6f6f"/><rect x="100" y="398" width="20" height="20" fill="#6f6f6f"/><rect x="120" y="398" width="20" height="20" fill="#6f6f6f"/><rect x="140" y="398" width="20" height="20" fill="#6f6f6f"/><rect x="160" y="398" width="20" height="20" fill="#6f6f6f"/>
  </g>

  <text x="230" y="278" font-size="12" fill="#333">R/G vary smoothly wherever the normal does - that</text>
  <text x="230" y="296" font-size="12" fill="#333">spatial coherence is the only reason PNG compresses this at all.</text>
  <text x="230" y="324" font-size="12" fill="#333">The grey cells are A = 0 (or excluded voids) - mostly a solid</text>
  <text x="230" y="342" font-size="12" fill="#333">block, so A costs almost nothing after compression.</text>
  <text x="230" y="370" font-size="12" fill="#333">Where valid is False the whole pixel is FLAT_TILE_RGBA</text>
  <text x="230" y="388" font-size="12" fill="#333">(127, 127, 255, 255) - a flat, smooth, snow-visible</text>
  <text x="230" y="406" font-size="12" fill="#333">ground value a real flat pixel would produce anyway.</text>
</svg>
