<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>weBIGeo Tiles Server — Map</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><text y='25' font-size='27'>🧩</text></svg>">
  <script>
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    document.documentElement.setAttribute('data-bs-theme', mq.matches ? 'dark' : 'light');
    mq.addEventListener('change', e => document.documentElement.setAttribute('data-bs-theme', e.matches ? 'dark' : 'light'));
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/flatly/bootstrap.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #map {
      position: absolute;
      top: 56px;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ccc;
    }

    .status-banner {
      position: absolute;
      top: 68px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }

    .layer-order-control {
      background: var(--bs-body-bg, #fff);
      color: var(--bs-body-color, #212529);
      border-radius: .5rem;
      box-shadow: 0 1px 5px rgba(0, 0, 0, .4);
      min-width: 200px;
    }

    .layer-order-control ul {
      list-style: none;
      margin: 0;
      padding: .4rem;
    }

    .layer-order-control li {
      display: flex;
      align-items: center;
      gap: .4rem;
      padding: .25rem .3rem;
      border-radius: .25rem;
      cursor: grab;
    }

    .layer-order-control li:hover {
      background: rgba(127, 127, 127, .15);
    }

    .layer-order-control li.dragging {
      opacity: .4;
    }

    .layer-order-control li.drag-over {
      outline: 2px dashed #6c757d;
    }

    .layer-order-control .drag-handle {
      color: #6c757d;
      user-select: none;
    }

    .layer-order-control label {
      display: flex;
      align-items: center;
      gap: .4rem;
      margin: 0;
      flex-grow: 1;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <nav class="navbar navbar-expand px-3" style="height:56px">
    <a class="navbar-brand d-flex align-items-center gap-2" href="./">
      <span style="font-size:1.4rem">🧩</span>
      <span class="fs-6 fw-semibold">weBIGeo Tiles Server</span>
    </a>
    <span class="text-secondary small ms-2">Debug ortho tiles</span>
    <span class="text-secondary small ms-4 me-2">Snow date:</span>
    <select id="snow-date-select" class="form-select form-select-sm" style="width:auto"></select>
    <button id="als-zoom" class="btn btn-sm btn-outline-secondary ms-4" type="button" disabled>ALS normals: zoom to coverage</button>
  </nav>

  <div id="map"></div>
  <div class="alert alert-warning shadow status-banner d-none" id="status-banner" role="alert"></div>
  <div class="alert alert-warning shadow status-banner d-none" id="status-banner-snow" style="top:108px" role="alert"></div>

  <script>
    // Stephansplatz, matches debug_ortho.STEPHANSPLATZ_LAT/LON.
    const CENTER = [48.2084639, 16.3720438];

    const map = L.map('map', {
      center: CENTER,
      zoom: 17,
      minZoom: 2,
      maxZoom: 21,
    });

    const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 21,
      maxNativeZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    });

    // Path order is z/y/x, matching basemap.at's own WMTS layout (see debug_ortho.py).
    const basemapAtLayer = L.tileLayer('https://mapsneu.wien.gv.at/basemap/geolandbasemap/normal/google3857/{z}/{y}/{x}.png', {
      maxZoom: 21,
      maxNativeZoom: 20,
      attribution: '&copy; <a href="https://basemap.at/">basemap.at</a>',
    }).addTo(map);

    // Same source basemap.at orthofoto tiles debug_ortho.py itself fetches
    // (see URL_TEMPLATE there), served here directly/unprocessed for comparison.
    const basemapAtOrthoLayer = L.tileLayer('https://mapsneu.wien.gv.at/basemap/bmaporthofoto30cm/normal/google3857/{z}/{y}/{x}.jpeg', {
      maxZoom: 21,
      maxNativeZoom: 20,
      attribution: '&copy; <a href="https://basemap.at/">basemap.at</a>',
    }).addTo(map);

    const debugOrthoLayer = L.tileLayer('./v1/debug-ortho/{z}/{y}/{x}.jpeg', {
      tileSize: 256,
      minZoom: 0,
      maxZoom: 21,
      minNativeZoom: 0,
      maxNativeZoom: 21,
      attribution: 'Imagery &copy; <a href="https://basemap.at/">basemap.at</a> (weBIGeo debug dataset)',
    }).addTo(map);

    // Synthetic overlay (no server round-trip - drawn client-side per tile)
    // showing each tile's z/x/y and a border, useful when debugging any
    // layer's tiling regardless of what that layer actually renders.
    const TileGridDebugLayer = L.GridLayer.extend({
      createTile: function (coords) {
        const tile = document.createElement('canvas');
        const size = this.getTileSize();
        tile.width = size.x;
        tile.height = size.y;
        const ctx = tile.getContext('2d');

        ctx.strokeStyle = 'rgba(255,0,0,.6)';
        ctx.lineWidth = 1;
        ctx.strokeRect(0.5, 0.5, size.x - 1, size.y - 1);

        const zLabel = `z${coords.z}`;
        const xyLabel = `x${coords.x} y${coords.y}`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = 'bold 20px sans-serif';
        const zWidth = ctx.measureText(zLabel).width;
        ctx.font = '12px sans-serif';
        const xyWidth = ctx.measureText(xyLabel).width;
        const boxW = Math.max(zWidth, xyWidth) + 12;
        const boxH = 40;
        ctx.fillStyle = 'rgba(0,0,0,.55)';
        ctx.fillRect(size.x / 2 - boxW / 2, size.y / 2 - boxH / 2, boxW, boxH);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(zLabel, size.x / 2, size.y / 2 - 10);
        ctx.font = '12px sans-serif';
        ctx.fillText(xyLabel, size.x / 2, size.y / 2 + 10);

        return tile;
      },
    });
    const tileGridDebugLayer = new TileGridDebugLayer({ tileSize: 256, minZoom: 0, maxZoom: 21 });

    // COSMOS snow depth is date-selectable (see the dropdown in the navbar) -
    // its layerEntries slot is added dynamically once the available dates are
    // known, by selectSnowDate() further down.
    //
    // All entries are overlays (not mutually-exclusive base layers), listed
    // here topmost-first. Order in this array IS the stacking order - the
    // custom control below lets it be dragged to rearrange, since Leaflet's
    // built-in layers control has no reordering support.
    const layerEntries = [
      { name: 'Tile grid/debug labels', layer: tileGridDebugLayer, active: false },
      { name: 'Debug ortho tiles', layer: debugOrthoLayer, active: true },
      { name: 'basemap.at (satellite)', layer: basemapAtOrthoLayer, active: true },
      { name: 'basemap.at', layer: basemapAtLayer, active: true },
      { name: 'OpenStreetMap', layer: osmLayer, active: false },
    ];

    // Re-stack every active layer bottom-to-top by calling the GridLayer-level
    // bringToFront() (raises within the shared tile pane) in list order, back
    // to front, so the array's front entry ends up genuinely on top.
    function applyLayerOrder() {
      for (let i = layerEntries.length - 1; i >= 0; i--) {
        const entry = layerEntries[i];
        if (entry.active && map.hasLayer(entry.layer)) {
          entry.layer.bringToFront();
        }
      }
    }

    const LayerOrderControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function () {
        const container = L.DomUtil.create('div', 'leaflet-bar layer-order-control');
        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);
        this._container = container;
        this._renderList();
        return container;
      },
      _renderList: function () {
        const container = this._container;
        container.innerHTML = '';
        const list = L.DomUtil.create('ul', '', container);

        layerEntries.forEach((entry, index) => {
          const item = L.DomUtil.create('li', '', list);
          item.draggable = true;
          item.dataset.index = String(index);

          const handle = L.DomUtil.create('span', 'drag-handle', item);
          handle.textContent = '⠿';

          const label = L.DomUtil.create('label', '', item);
          const checkbox = L.DomUtil.create('input', '', label);
          checkbox.type = 'checkbox';
          checkbox.checked = entry.active;
          const text = L.DomUtil.create('span', '', label);
          text.textContent = entry.name;

          checkbox.addEventListener('change', () => {
            entry.active = checkbox.checked;
            if (entry.active) {
              map.addLayer(entry.layer);
            } else {
              map.removeLayer(entry.layer);
            }
            applyLayerOrder();
          });

          item.addEventListener('dragstart', e => {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', String(index));
            item.classList.add('dragging');
          });
          item.addEventListener('dragend', () => item.classList.remove('dragging'));
          item.addEventListener('dragover', e => {
            e.preventDefault();
            item.classList.add('drag-over');
          });
          item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
          item.addEventListener('drop', e => {
            e.preventDefault();
            item.classList.remove('drag-over');
            const fromIndex = Number(e.dataTransfer.getData('text/plain'));
            const toIndex = Number(item.dataset.index);
            if (fromIndex === toIndex) return;
            const [moved] = layerEntries.splice(fromIndex, 1);
            layerEntries.splice(toIndex, 0, moved);
            applyLayerOrder();
            this._renderList();
          });
        });
      },
    });

    const layerOrderControl = new LayerOrderControl().addTo(map);
    applyLayerOrder();

    const banner = document.getElementById('status-banner');

    async function pollStatus() {
      try {
        const { status } = await fetch('./v1/debug-ortho/status').then(r => r.json());
        if (status === 'ready') {
          if (!banner.classList.contains('d-none')) {
            banner.classList.add('d-none');
            debugOrthoLayer.redraw();
          }
          return; // stop polling once ready
        }
        banner.classList.remove('d-none');
        banner.className = 'alert shadow status-banner ' + (status === 'error' ? 'alert-danger' : 'alert-warning');
        banner.textContent = status === 'error'
          ? 'Debug ortho tile generation failed — check the server log.'
          : 'Debug ortho tiles are still generating, some tiles may be missing…';
      } catch {
        banner.classList.remove('d-none');
        banner.className = 'alert alert-danger shadow status-banner';
        banner.textContent = 'Could not reach the tiles server.';
      }
      setTimeout(pollStatus, 3000);
    }

    pollStatus();

    // === COSMOS SNOW: date-selectable layer ===
    const snowDateSelect = document.getElementById('snow-date-select');
    const bannerSnow = document.getElementById('status-banner-snow');
    let cosmosSnowEntry = null; // layerEntries element for the snow layer, created on first date load
    // Bumped on every date switch so a poll loop for a since-abandoned date
    // stops updating the (now reassigned) banner/layer instead of racing the
    // poll loop for the newly selected date.
    let snowPollGeneration = 0;

    // Raw R=avg/G=min/B=max centimeter values (each channel linearly quantized
    // 0-CEILING_CM, see cosmos_snow.py's _encode_cm/CEILING_CM), not a colormap -
    // renders as a raw RGB raster until a display transform is added.
    function createCosmosSnowLayer(date) {
      return L.tileLayer(`./v1/cosmos-snow/${date}/{z}/{x}/{y}.png`, {
        tileSize: 256,
        minZoom: 0,
        maxZoom: 21,
        minNativeZoom: 0,
        maxNativeZoom: 13,
        attribution: `Snow depth &copy; exolabs / COSMOS (${date})`,
      });
    }

    function selectSnowDate(date) {
      snowPollGeneration++;
      const wasActive = cosmosSnowEntry ? cosmosSnowEntry.active : true;
      if (cosmosSnowEntry && map.hasLayer(cosmosSnowEntry.layer)) {
        map.removeLayer(cosmosSnowEntry.layer);
      }
      const layer = createCosmosSnowLayer(date);
      if (cosmosSnowEntry) {
        cosmosSnowEntry.layer = layer;
        cosmosSnowEntry.name = `COSMOS snow depth (${date})`;
      } else {
        cosmosSnowEntry = { name: `COSMOS snow depth (${date})`, layer, active: true };
        layerEntries.unshift(cosmosSnowEntry);
      }
      if (wasActive) {
        map.addLayer(layer);
      }
      applyLayerOrder();
      layerOrderControl._renderList();
      bannerSnow.classList.add('d-none');
      pollCosmosSnowStatus(date, snowPollGeneration);
    }

    async function pollCosmosSnowStatus(date, generation) {
      if (generation !== snowPollGeneration) return; // a newer date was selected meanwhile
      try {
        const { status } = await fetch(`./v1/cosmos-snow/${date}/status`).then(r => r.json());
        if (generation !== snowPollGeneration) return;
        if (status === 'ready') {
          if (!bannerSnow.classList.contains('d-none')) {
            bannerSnow.classList.add('d-none');
          }
          cosmosSnowEntry.layer.redraw();
          return; // stop polling once ready
        }
        bannerSnow.classList.remove('d-none');
        bannerSnow.className = 'alert shadow status-banner ' + (status === 'error' ? 'alert-danger' : 'alert-warning');
        bannerSnow.textContent = status === 'error'
          ? `COSMOS snow depth generation for ${date} failed — check the server log.`
          : `COSMOS snow depth tiles for ${date} are still generating, some tiles may be missing…`;
      } catch {
        if (generation !== snowPollGeneration) return;
        bannerSnow.classList.remove('d-none');
        bannerSnow.className = 'alert alert-danger shadow status-banner';
        bannerSnow.textContent = 'Could not reach the tiles server.';
      }
      setTimeout(() => pollCosmosSnowStatus(date, generation), 3000);
    }

    async function loadSnowDates() {
      try {
        const dates = await fetch('./v1/cosmos-snow/dates').then(r => r.json());
        snowDateSelect.innerHTML = '';
        if (dates.length === 0) {
          const opt = document.createElement('option');
          opt.textContent = 'no dates generated yet';
          opt.disabled = true;
          snowDateSelect.appendChild(opt);
          return;
        }
        for (const { date, status } of dates) {
          const opt = document.createElement('option');
          opt.value = date;
          opt.textContent = status === 'ready' ? date : `${date} (${status})`;
          snowDateSelect.appendChild(opt);
        }
        const latest = dates[dates.length - 1].date; // dates sort lexicographically = chronologically
        snowDateSelect.value = latest;
        selectSnowDate(latest);
      } catch {
        // leave the dropdown empty; user can retry by reloading the page
      }
    }

    snowDateSelect.addEventListener('change', () => selectSnowDate(snowDateSelect.value));
    loadSnowDates();

    // === ALS NORMALS ===
    // The encoded PNGs exactly as stored - no decode, no shading. Starting a run
    // and reporting its progress belong to the landing page; this page only
    // views the result.
    const alsZoomBtn = document.getElementById('als-zoom');
    let alsBounds = null;  // [w, s, e, n] from the source raster, or null
    let alsEntry = null;   // its layerEntries element

    async function loadAlsNormals() {
      let info;
      try {
        info = await fetch('./v1/als-normals/status').then(r => r.json());
      } catch {
        return; // landing page already reports an unreachable server
      }
      alsBounds = info.bounds;
      // Starts inactive: the coverage is one 50km footprint elsewhere in
      // Austria, so switching it on over the Vienna default view would just
      // look broken. The zoom button below turns it on with the jump.
      alsEntry = {
        name: `ALS normals (${info.source})`,
        layer: L.tileLayer('./v1/als-normals/{z}/{x}/{y}.png', {
          tileSize: 256,
          minZoom: 0,
          maxZoom: 21,
          minNativeZoom: info.min_zoom,
          maxNativeZoom: info.max_zoom,
          attribution: 'Normals derived from <a href="https://www.bev.gv.at/">BEV</a> ALS',
        }),
        active: false,
      };
      layerEntries.unshift(alsEntry);
      layerOrderControl._renderList();

      alsZoomBtn.disabled = !alsBounds;
      pollAlsUntilReady();
    }

    // Deliberately silent: no banner, no button - status belongs to the landing
    // page. Generation writes tiles as it goes, so this redraws the layer on
    // every tick to pull in whatever has landed since, and stops once ready.
    // Only while the layer is switched on, so an unused layer costs nothing.
    async function pollAlsUntilReady() {
      try {
        const { status } = await fetch('./v1/als-normals/status').then(r => r.json());
        if (alsEntry && alsEntry.active) alsEntry.layer.redraw();
        if (status === 'ready' || status === 'unknown') return; // nothing more will land
      } catch {
        return;
      }
      setTimeout(pollAlsUntilReady, 5000);
    }

    alsZoomBtn.addEventListener('click', () => {
      if (!alsBounds) return;
      const [w, s, e, n] = alsBounds;
      map.fitBounds([[s, w], [n, e]]);
      // Switch the layer on with the jump, otherwise arriving at the coverage
      // looks identical to not having arrived.
      if (alsEntry && !alsEntry.active) {
        alsEntry.active = true;
        map.addLayer(alsEntry.layer);
        applyLayerOrder();
        layerOrderControl._renderList();
      }
    });

    loadAlsNormals();
  </script>
</body>

</html>
